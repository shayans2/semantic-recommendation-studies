          layer_num: 3          # L_ui, collaborative graph
          ii_layer_num: 1       # L_ii, frozen item-item graph
          knn_k: 10             # neighbours per item
          rho: 0.2              # fraction of edges pruned per epoch
          reg_weight: 1.0e-7    # beta
          kd_weight: 3.0e-2     # alpha
          kd_temperature: 0.2   # tau
      SIG_NoPrune:
