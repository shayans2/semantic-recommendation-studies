datasets:
  yelp:
    data_dir: "./data/yelp"
    train_file: "trn_mat.pkl"
    val_file: "val_mat.pkl"
    test_file: "tst_mat.pkl"

    user_num: 11091
    item_num: 11010
    epoch: 3000
    learning_rate: 1.0e-3
    weight_decay: 0
    batch_size: 1024
    patience: 5

    models:
      # Yelp residual bridges: item-only RLMRec plus exactly one FREEDOM
      # training choice each, at the published 32D protocol. Combined applies
      # all three at FREEDOM's yelp-selected KD weight, mirroring the amazon
      # residual_bridge_pilot design.
      RLMRec_Bridge_PosOnly_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_Bridge_Mean_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_Bridge_DegreePrune_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
          rho: 0.2
      RLMRec_Bridge_Combined_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-1
          kd_temperature: 0.2
          rho: 0.2
      LightGCN_RLMRec_64:
        hyperparameters:
          embedding_size: 64
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
      LightGCN_plus_RLMRec_64:
        hyperparameters:
          embedding_size: 64
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_ItemOnly_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_ItemOnly_64:
        hyperparameters:
          embedding_size: 64
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      LightGCN_RLMRec_Exact:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
      LightGCN_plus_RLMRec_Exact:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_Coverage:
        hyperparameters:
          embedding_size: 64
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
          profile_coverage: 1.0
      SIG_PermutedGraph:
        hyperparameters:
          embedding_size: 64
          layer_num: 3          # L_ui, collaborative graph
          ii_layer_num: 1       # L_ii, frozen item-item graph
          knn_k: 10             # neighbours per item
          rho: 0.2              # fraction of edges pruned per epoch
          reg_weight: 1.0e-7    # beta
          kd_weight: 3.0e-2     # alpha
          kd_temperature: 0.2   # tau
      SIG_RandomGraph:
        hyperparameters:
          embedding_size: 64
          layer_num: 3          # L_ui, collaborative graph
          ii_layer_num: 1       # L_ii, frozen item-item graph
          knn_k: 10             # neighbours per item
          rho: 0.2              # fraction of edges pruned per epoch
          reg_weight: 1.0e-7    # beta
          kd_weight: 3.0e-2     # alpha
