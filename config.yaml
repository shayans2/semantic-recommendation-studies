  # Third RLMRec dataset, from the same Nov 2023 release as amazon and yelp.
  # Added to test a prediction made from the semantic-agreement diagnostic
  # before any steam model was trained, not to search for a better outcome.
  # Protocol mirrors the published yelp settings; no steam hyperparameter has
  # been tuned, and SIG's kd_weight carries amazon's value unchanged.
  steam:
    data_dir: "./data/steam"
    train_file: "trn_mat.pkl"
    val_file: "val_mat.pkl"
    test_file: "tst_mat.pkl"

    user_num: 23310
    item_num: 5237
    epoch: 3000
    learning_rate: 1.0e-3
    weight_decay: 0
    batch_size: 4096
    patience: 5

    models:
      LightGCN_RLMRec_Exact:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
      LightGCN_plus_RLMRec_Exact:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      RLMRec_ItemOnly_32:
        hyperparameters:
          embedding_size: 32
          keep_rate: 0.8
          layer_num: 3
          reg_weight: 1.0e-7
          kd_weight: 1.0e-2
          kd_temperature: 0.2
      SIG:
        hyperparameters:
          embedding_size: 32
          layer_num: 3          # L_ui, collaborative graph
          ii_layer_num: 1       # L_ii, frozen item-item graph
          knn_k: 10             # neighbours per item
          rho: 0.2              # fraction of edges pruned per epoch
          reg_weight: 1.0e-7    # beta
          kd_weight: 3.0e-2     # alpha, amazon's value, untuned for steam
          kd_temperature: 0.2   # tau
      SIG_PermutedGraph:
        hyperparameters:
          embedding_size: 32
          layer_num: 3
          ii_layer_num: 1
          knn_k: 10
          rho: 0.2
          reg_weight: 1.0e-7
          kd_weight: 3.0e-2
          kd_temperature: 0.2
